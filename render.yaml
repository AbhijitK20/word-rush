services:
  - type: web
    name: word-rush
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    domains:
      - wordrush.abhi2.me
    envVars:
      - key: NODE_ENV
        value: production
